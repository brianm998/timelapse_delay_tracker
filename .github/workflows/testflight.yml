name: TestFlight

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run scripts/test.sh before building
        type: boolean
        default: true

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    steps:
      - name: Require develop
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/develop" ]; then
            echo "TestFlight uploads run from develop only (got $REF)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-xcode
      - name: Test
        if: inputs.run_tests
        run: scripts/test.sh
      - name: Check metadata
        run: scripts/check_metadata.sh
      - name: Archive and upload
        id: release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/release.sh --ci
      - name: Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MARKETING: ${{ steps.release.outputs.marketing }}
          BUILD: ${{ steps.release.outputs.build }}
        run: |
          {
            echo "## TestFlight upload"
            echo "- Tag: \`$TAG\`"
            echo "- Version: $MARKETING"
            echo "- Build: $BUILD"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs and dSYMs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics
          path: |
            build/*.log
            build/*.xcarchive/dSYMs
            build/test.xcresult
          if-no-files-found: ignore
          retention-days: 7
