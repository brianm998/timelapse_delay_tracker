# SPDX-License-Identifier: MIT
# Solo fast: explore, develop, fast tests, land directly. For side projects and low risk.
schema = 1
start = "explore"
explored_entry = "develop"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
suites = ["ios"]
max_rounds = 3
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

# Unit tests plus the offscreen UI smoke test (ContentViewSmokeTests), in the app-hosted
# TimelapseDelayTrackerTests bundle. scripts/test.sh creates a throwaway simulator per run and
# deletes it afterwards (booted headless, no Simulator window). It does not use a MASON
# `ios-simulator` environment because that pool includes every simulator on this Mac, among them
# ones another pipeline uses. Never add an XCUITest bundle: nothing automated may appear on this
# Mac's screen, and the xcodebuild shim refuses UI test runs under MASON.
[suite.ios]
command = "scripts/test.sh"
parser = "xctest"
min_tests = 5
level = "unit"
