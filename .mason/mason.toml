# SPDX-License-Identifier: MIT
# Solo fast: explore, develop, fast tests, land directly. For side projects and low risk.
schema = 1
start = "explore"
explored_entry = "develop"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
suites = ["ios"]
max_rounds = 3
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

# Unit tests plus the offscreen UI smoke test (ContentViewSmokeTests), in the app-hosted
# TimelapseDelayTrackerTests bundle. MASON leases one simulator per run, boots it headless
# (`simctl boot`, no Simulator window) and sets MASON_DEVICE to its id. Never add an XCUITest
# bundle: nothing automated may appear on this Mac's screen, and the xcodebuild shim refuses
# UI test runs under MASON. Render screens offscreen instead.
[suite.ios]
command = "rm -rf build/test.xcresult && xcodebuild test -project TimelapseDelayTracker.xcodeproj -scheme TimelapseDelayTracker -destination \"id=$MASON_DEVICE\" -derivedDataPath build/DerivedData -resultBundlePath build/test.xcresult 2>&1"
parser = "xctest"
min_tests = 5
level = "unit"
env = "simulator"

[environment.simulator]
type = "ios-simulator"
os = "26"
