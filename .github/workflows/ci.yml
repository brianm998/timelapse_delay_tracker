name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: App Store metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_metadata.sh

  # macOS minutes cost 10x on private repos, so decide cheaply on Linux whether the
  # change touches anything but docs, markdown and App Store text files.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$BASE_SHA"; fi
          if [ "$EVENT" = "push" ]; then base="$BEFORE_SHA"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running tests."
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "$changed"
          code=$(echo "$changed" | grep -v -E '^(docs/|AppStore/.*\.txt$)|\.md$' || true)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Test
        run: scripts/test.sh
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-xcresult
          path: build/test.xcresult
          retention-days: 7
